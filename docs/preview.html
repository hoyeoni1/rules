<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>견본 — 사용자 화면</title>
<link rel="stylesheet" href="pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="navbar"><button class="icon-btn" aria-label="뒤로"><i class="icon i-back"></i></button><span class="title"></span><span></span></header>

  <section class="top">
    <p class="sub-top">11월 첫째 주</p>
    <h1 class="title">회의실 예약이<br>3건 있어요</h1>
  </section>

  <div class="chips" role="group" aria-label="상태">
    <button class="chip" aria-pressed="true">전체</button><button class="chip" aria-pressed="false">예정</button><button class="chip" aria-pressed="false">지난 예약</button>
  </div>

  <ul class="list">
    <li><button class="row"><span class="asset square brand">3</span><span class="texts"><p class="r-title">주간 회의</p><p class="r-sub">11월 3일 (월) 오전 10:00 · 3층 A</p></span><span class="right"><p class="r-value">1시간</p><p class="r-value-sub">6명</p></span><i class="icon i-chevron"></i></button></li>
    <li><button class="row"><span class="asset square">4</span><span class="texts"><p class="r-title">디자인 리뷰</p><p class="r-sub">11월 4일 (화) 오후 2:00 · 5층 C</p></span><span class="right"><p class="r-value">30분</p><p class="r-value-sub">4명</p></span><i class="icon i-chevron"></i></button></li>
    <li><button class="row"><span class="asset square">6</span><span class="texts"><p class="r-title">채용 면접</p><p class="r-sub">11월 6일 (목) 오후 4:00 · 2층 B</p></span><span class="right"><p class="r-value">1시간</p><span class="badge caution">승인 대기</span></span><i class="icon i-chevron"></i></button></li>
  </ul>

  <div class="gap16"></div>

  <div class="section-head"><h2>새 예약</h2></div>
  <div class="field"><label for="f1">회의 이름</label><input id="f1" class="input" placeholder="예: 주간 회의"></div>
  <div class="field error"><label for="f2">인원</label><input id="f2" class="input num" value="24" inputmode="numeric"><p class="help">선택한 회의실은 최대 12명까지 쓸 수 있어요.</p></div>
  <div class="notice"><strong>5층 대회의실</strong>은 20명까지 들어가요. 이 회의실로 바꿀까요?</div>

  <div class="gap16"></div>

  <div class="section-head"><h2>이번 달 이용</h2><button class="text-btn">자세히</button></div>
  <dl class="kv">
    <div><dt>예약</dt><dd class="num">12건</dd></div>
    <div><dt>이용 시간</dt><dd class="num">14시간 30분</dd></div>
    <div><dt>취소</dt><dd class="num">1건</dd></div>
  </dl>
</main>

<div class="bottom-cta"><div class="inner"><button class="btn dark weak">닫기</button><button class="btn">예약하기</button></div></div>
<div class="toast" role="status">예약을 취소했어요</div>
</body>
</html>
