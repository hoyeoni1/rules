<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>견본 — 관리 화면</title>
<link rel="stylesheet" href="pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="메뉴">
    <div class="brand">회의실 관리</div>
    <a class="side-item" href="#" aria-current="page">예약 현황<span class="count">128</span></a>
    <a class="side-item" href="#">승인 대기<span class="count">7</span></a>
    <a class="side-item" href="#">회의실</a>
    <div class="group-label">설정</div>
    <a class="side-item" href="#">운영 시간</a>
    <a class="side-item" href="#">권한</a>
  </nav>

  <main class="main">
    <div class="main-head">
      <div><p class="t7 c-3">11월 1일 – 11월 7일</p><h1 class="t2">예약 현황</h1></div>
      <div class="toolbar">
        <div class="segmented" role="group" aria-label="기간" style="width:180px"><button aria-pressed="true">이번 주</button><button aria-pressed="false">이번 달</button></div>
        <input class="search" placeholder="회의 이름, 예약자" aria-label="검색">
        <button class="btn medium">회의실 추가</button>
      </div>
    </div>

    <section class="metrics" aria-label="요약">
      <div class="metric"><span class="label">예약</span><span class="value">128<small>건</small></span><span class="note">지난주 114건</span></div>
      <div class="metric"><span class="label">평균 이용률</span><span class="value">72<small>%</small></span><span class="note">업무 시간 기준</span></div>
      <div class="metric"><span class="label">승인 대기</span><span class="value c-danger">7<small>건</small></span><span class="note">가장 오래된 요청 2일 전</span></div>
    </section>

    <section class="group">
      <div class="group-head"><h2>승인이 필요해요</h2><button class="text-btn">모두 보기</button></div>
      <button class="row"><span class="asset">김</span><span class="texts"><p class="r-title">채용 면접 · 2층 B</p><p class="r-sub">김지원 · 11월 6일 오후 4:00 · 1시간</p></span><span class="badge caution">2일 대기</span></button>
      <button class="row"><span class="asset">박</span><span class="texts"><p class="r-title">분기 리뷰 · 5층 대회의실</p><p class="r-sub">박서연 · 11월 7일 오전 9:00 · 2시간</p></span><span class="badge">오늘</span></button>
    </section>

    <section class="group">
      <div class="group-head"><h2>회의실별 이용</h2></div>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>회의실</th><th>위치</th><th class="r" aria-sort="descending"><button>이용률</button></th><th class="r">예약</th><th>상태</th></tr></thead>
        <tbody>
          <tr><td class="strong">대회의실</td><td>5층</td><td class="r">91%</td><td class="r">34</td><td><span class="badge danger">부족</span></td></tr>
          <tr><td class="strong">A</td><td>3층</td><td class="r">78%</td><td class="r">41</td><td><span class="badge success">정상</span></td></tr>
          <tr><td class="strong">B</td><td>2층</td><td class="r">64%</td><td class="r">29</td><td><span class="badge success">정상</span></td></tr>
          <tr><td class="strong">C</td><td>5층</td><td class="r">23%</td><td class="r">8</td><td><span class="badge">여유</span></td></tr>
        </tbody>
      </table></div>
    </section>
  </main>
</div>
</body>
</html>
